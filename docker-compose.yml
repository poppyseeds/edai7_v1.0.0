services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./generated:/app/generated
      - ./datasets:/app/datasets
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env.example
    volumes:
      - ./generated:/app/generated
      - ./datasets:/app/datasets
    command: streamlit run frontend/dashboard.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
